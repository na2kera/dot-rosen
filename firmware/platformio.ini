; ドット路線メーカー: 感熱プリンタ（M5Stack ATOM Printer K118 / ATOM Lite）のファーム
; 版は固定する。espressif32 6.12.0 は Arduino-ESP32 2.0.17 を使う。
[platformio]
default_envs = atom

[env:atom]
platform = espressif32@6.12.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
; 外部ライブラリは使わない（LED は Arduino-ESP32 の neopixelWrite、JSON は自前の簡易読み取り）
